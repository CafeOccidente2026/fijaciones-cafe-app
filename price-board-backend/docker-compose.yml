services:
  postgres:
    image: postgres:16-alpine
    container_name: price_board_db
    restart: always
    environment:
      POSTGRES_USER: price_board_user
      POSTGRES_PASSWORD: price_board_pass
      POSTGRES_DB: price_board
    ports:
      - "5432:5432"
    volumes:
      - price_board_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_board_user -d price_board"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  price_board_data:
